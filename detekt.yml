# Configuración de análisis estático para HabitusApp

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

# Complejidad
complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    excludes: ['**/test/**', '**/androidTest/**']
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    excludes: ['**/test/**', '**/androidTest/**']
  NestedBlockDepth:
    active: true
    threshold: 5

# Convenciones de código
naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
  VariableNaming:
    active: true
    variablePattern: '[a-zA-Z][a-zA-Z0-9]*'
  ObjectPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'

# Buenas prácticas
style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '100', '7', '14', '30']
    ignoreAnnotated: ['androidx.annotation.IntRange']
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
    excludeImports: true
  ReturnCount:
    active: true
    max: 4
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected)'
  ForbiddenComment:
    active: true
    values: ['STOPSHIP', 'FIXME', 'HACK']
    allowedPatterns: ''
  WildcardImport:
    active: true
    excludeImports: ['android.*', 'androidx.*', 'kotlinx.*']

# Posibles bugs
potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ImplicitDefaultLocale:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
    excludes: ['**/test/**']

# Rendimiento
performance:
  active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true

# Exclusiones globales
excludes: |
  '**/build/**'
  '**/generated/**'
  '**/*.java'
