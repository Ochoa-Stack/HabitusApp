  LongParameterList:
    functionThreshold: 10  # Subir de 6 a 10
    constructorThreshold: 10
  NestedBlockDepth:
    threshold: 6  # Subir de 4 a 6
  TooManyFunctions:
    thresholdInClasses: 30  # Subir de 11 a 30
